services:
  # -------------------------------------------------------------
  # Backend Web Service (Django REST Framework + Gunicorn)
  # -------------------------------------------------------------
  - type: web
    name: campuscart-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true

  # -------------------------------------------------------------
  # Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  - type: web
    name: campuscart-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: campuscart-backend
          envVarKey: RENDER_EXTERNAL_URL
